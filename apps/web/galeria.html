<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Bellum Gentium · Galería de sprites</title>
    <style>
      body { margin: 0; padding: 16px; background: #10121a; color: #ece6d8; font: 14px system-ui, sans-serif; }
      canvas { display: block; margin-top: 12px; }
    </style>
  </head>
  <body>
    <!-- Herramienta para arte: todas las unidades por raza (?armor=royal) o todas
         las armaduras de una unidad (?mode=armors&type=knight). -->
    <strong>Galería de sprites</strong> ·
    <a style="color:#e8c164" href="?armor=royal">Razas</a> ·
    <a style="color:#e8c164" href="?mode=armors&type=guardian">Armaduras</a> ·
    <a style="color:#e8c164" href="?mode=specials">Comandantes y jefes</a>
    <canvas id="c"></canvas>
    <script type="module">
      import { getSprite } from '/src/art/sprites.ts';
      import { COMMANDERS } from '@gentium/engine';
      const races = ['human', 'elf', 'orc', 'undead', 'dwarf'];
      const types = ['warrior', 'archer', 'knight', 'guardian', 'mage', 'healer', 'golem'];
      const armors = ['iron', 'steel', 'runic', 'royal', 'eclipse'];
      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'specials') {
        const S2 = 150;
        const c2 = document.getElementById('c');
        const ids = Object.keys(COMMANDERS);
        c2.width = 5 * S2; c2.height = 3 * S2;
        const x2 = c2.getContext('2d');
        ids.forEach((id, i) => x2.drawImage(getSprite('commander', COMMANDERS[id].race, 'royal', 1, false, id), (i % 5) * S2, Math.floor(i / 5) * S2, S2, S2));
        x2.drawImage(getSprite('boss', 'orc', 'iron', -1, false, 'ash-dragon'), 0, 2 * S2, S2, S2);
        x2.drawImage(getSprite('boss', 'orc', 'iron', -1, false, 'void-colossus'), S2, 2 * S2, S2, S2);
      } else {
      const byArmor = params.get('mode') === 'armors';
      const cols = byArmor ? armors : types;
      const S = 130;
      const c = document.getElementById('c');
      c.width = cols.length * S;
      c.height = races.length * S;
      const x = c.getContext('2d');
      races.forEach((race, j) => cols.forEach((col, i) => {
        const sprite = byArmor
          ? getSprite(params.get('type') || 'warrior', race, col, 1)
          : getSprite(col, race, params.get('armor') || 'royal', 1);
        x.drawImage(sprite, i * S, j * S, S, S);
      }));
      }
    </script>
  </body>
</html>
